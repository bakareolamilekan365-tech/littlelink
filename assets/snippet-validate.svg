  <circle cx="132" cy="80" r="10" fill="#FFBD2E"/>
  <circle cx="162" cy="80" r="10" fill="#27C93F"/>
  <text x="95" y="145" fill="#C792EA" font-family="Consolas, Monaco, monospace" font-size="28">def</text>
  <text x="146" y="145" fill="#E5C07B" font-family="Consolas, Monaco, monospace" font-size="28"> validate_message</text>
  <text x="388" y="145" fill="#ABB2BF" font-family="Consolas, Monaco, monospace" font-size="28">(</text>
  <text x="402" y="145" fill="#E06C75" font-family="Consolas, Monaco, monospace" font-size="28">message</text>
  <text x="519" y="145" fill="#ABB2BF" font-family="Consolas, Monaco, monospace" font-size="28">: str) -&gt; str:</text>
